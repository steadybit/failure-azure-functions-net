name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write # SonarQube Cloud login without a stored token
    env:
      sonar_available: ${{ secrets.SONAR_TOKEN != '' && 'true' || 'false' }}
      snyk_available: ${{ secrets.SNYK_TOKEN  != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - run: dotnet test
      - run: dotnet build --configuration Release

      - name: "[release] Set up Snyk CLI"
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.snyk_available == 'true' }}
        uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action
      - name: "[release] Snyk test"
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.snyk_available == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}
        run: snyk test --org="$SNYK_ORG_ID" --severity-threshold=high --all-projects --target-reference="$GITHUB_REF_NAME"

      # Secretless analysis: SonarQube Cloud exchanges the identity of this job for a token that is valid
      # for 30 minutes and for the project bound to this repository only. Pull requests from forks and
      # Dependabot runs get no identity; the stored SONAR_TOKEN stays as the fallback for now.
      - name: SonarQube Cloud login
        id: sonar-auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2 NOSONAR githubactions:S7637 - verified action creator
        with:
          export-env: false

      - name: Report a fallback to the stored Sonar token
        if: ${{ steps.sonar-auth.outcome == 'failure' && env.sonar_available == 'true' }}
        run: echo "::warning::SonarQube Cloud login without a token failed, the scan uses the stored SONAR_TOKEN. See the login step."

      - name: SonarCloud scan
        if: ${{ steps.sonar-auth.outputs.sonar-token != '' || env.sonar_available == 'true' }}
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token || secrets.SONAR_TOKEN }}

      - name: "[release] SonarCloud Quality Gate check"
        if: ${{  startsWith(github.ref, 'refs/tags/') && (steps.sonar-auth.outputs.sonar-token != '' || env.sonar_available == 'true') }}
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token || secrets.SONAR_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: audit
    timeout-minutes: 30
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - run: dotnet build --configuration Release
   
      - name: "[release] NuGet login"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: jedmeier
    
      - name: "[release] Publish"
        working-directory: ./SteadybitFaultInjection/bin/Release/
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: dotnet nuget push *.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}


  build_asp:
    name: Build ASP.NET Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: audit
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to Azure ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker build
        run: |
          docker build -t ${{ vars.ACR_NAME }}.azurecr.io/aspnetmiddleware:latest .

      - name: Docker tag
        run: |
          docker tag ${{ vars.ACR_NAME }}.azurecr.io/aspnetmiddleware:latest ${{ vars.ACR_NAME }}.azurecr.io/aspnetmiddleware:${{ github.sha }}

      - name: Push ASP Middleware Image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/aspnetmiddleware:latest
          docker push ${{ vars.ACR_NAME }}.azurecr.io/aspnetmiddleware:${{ github.sha }}
